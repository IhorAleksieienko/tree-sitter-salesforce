name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────────────────────
  # Grammar Tests — run tree-sitter test for all grammars
  # ─────────────────────────────────────────────────────────────
  grammar-tests:
    name: Grammar Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate all grammars
        run: npm run generate:all

      - name: Run all grammar tests
        run: npm run test:all

  # ─────────────────────────────────────────────────────────────
  # Python Binding Tests
  # ─────────────────────────────────────────────────────────────
  python-tests:
    name: Python Tests (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate all grammars
        run: npm ci && npm run generate:all

      - name: Install dependencies & package
        run: |
          python -m pip install --upgrade pip setuptools wheel setuptools-scm
          pip install "tree-sitter>=0.24.0"
          pip install .

      - name: Run Python smoke tests
        run: python scripts/test_bindings.py
