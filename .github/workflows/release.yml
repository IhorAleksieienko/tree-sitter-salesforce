name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "test_v*"

jobs:
  # ─────────────────────────────────────────────────────────────
  # Build Python Wheels for all platforms
  # ─────────────────────────────────────────────────────────────
  build-wheels:
    name: Build wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up QEMU
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Generate all grammars
        run: npm ci && npm run generate:all

      - name: Build wheels (cibuildwheel)
        uses: pypa/cibuildwheel@v2.22.0
        env:
          # Build for Python 3.10, 3.11, 3.12, 3.13
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-*"
          # Skip 32-bit Windows and musl Linux
          CIBW_SKIP: "*-win32 *-musllinux*"
          # ARM64 and x86_64 on macOS
          CIBW_ARCHS_MACOS: "x86_64 arm64"
          # ARM64 on Linux via QEMU emulation
          CIBW_ARCHS_LINUX: "x86_64 aarch64"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  # ─────────────────────────────────────────────────────────────
  # Build WASM Binaries
  # ─────────────────────────────────────────────────────────────
  build-wasm:
    name: Build WASM binaries
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: "3.1.50"

      - name: Generate all grammars
        run: npm ci && npm run generate:all

      - name: Build WASM for all grammars
        run: npm run build:wasm

      - name: Verify WASM files exist
        run: |
          ls -la bindings/web/
          for grammar in apex soql sosl formula apex_anon; do
            if [ ! -f "bindings/web/tree-sitter-${grammar}.wasm" ]; then
              echo "ERROR: Missing WASM for ${grammar}"
              exit 1
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: wasm-binaries
          path: bindings/web/*.wasm

  # ─────────────────────────────────────────────────────────────
  # Publish to TestPyPI (Runs ONLY on test_v* tags)
  # ─────────────────────────────────────────────────────────────
  publish-testpypi:
    name: Publish to TestPyPI
    if: startsWith(github.ref_name, 'test_')
    needs: [build-wheels]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/tree-sitter-salesforce/

    permissions:
      id-token: write # Required for trusted publishing (OIDC)

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  # ─────────────────────────────────────────────────────────────
  # Publish to Production PyPI (Runs ONLY on v*.*.* tags)
  # ─────────────────────────────────────────────────────────────
  publish-pypi:
    name: Publish to PyPI
    if: startsWith(github.ref_name, 'v') && !startsWith(github.ref_name, 'test_')
    needs: [build-wheels]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/tree-sitter-salesforce/

    permissions:
      id-token: write # Required for trusted publishing (OIDC)

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # ─────────────────────────────────────────────────────────────
  # Publish to npm with @test tag (Runs ONLY on test_v* tags if NPM_TOKEN exists)
  # ─────────────────────────────────────────────────────────────
  publish-npm-test:
    name: Publish to npm (@test)
    if: startsWith(github.ref_name, 'test_') && secrets.NPM_TOKEN != ''
    needs: [build-wheels, build-wasm]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - uses: actions/download-artifact@v4
        with:
          name: wasm-binaries
          path: bindings/web/

      - name: Generate all grammars
        run: npm ci && npm run generate:all

      - name: Publish to npm (@test tag)
        run: npm publish --access public --tag test
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ─────────────────────────────────────────────────────────────
  # Publish to npm with @latest (Runs ONLY on v*.*.* tags)
  # ─────────────────────────────────────────────────────────────
  publish-npm-prod:
    name: Publish to npm (@latest)
    if: startsWith(github.ref_name, 'v') && !startsWith(github.ref_name, 'test_')
    needs: [build-wheels, build-wasm]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - uses: actions/download-artifact@v4
        with:
          name: wasm-binaries
          path: bindings/web/

      - name: Generate all grammars
        run: npm ci && npm run generate:all

      - name: Publish to npm (@latest)
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
