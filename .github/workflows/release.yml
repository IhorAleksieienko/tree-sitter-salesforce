name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "test_v*"

jobs:
  # ─────────────────────────────────────────────────────────────
  # Test Gate: Grammar & Python Tests
  # Nothing builds or publishes if any test fails
  # ─────────────────────────────────────────────────────────────
  test-grammars:
    name: Test Grammars (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate all grammars
        run: npm run generate:all

      - name: Run all grammar tests
        run: npm run test:all

  test-python:
    name: Test Python (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate all grammars
        run: npm ci && npm run generate:all

      - name: Install dependencies & package
        run: |
          python -m pip install --upgrade pip setuptools wheel setuptools-scm
          pip install "tree-sitter>=0.24.0"
          pip install .

      - name: Run Python smoke tests
        run: python scripts/test_bindings.py

  # ─────────────────────────────────────────────────────────────
  # Build Python Wheels (Windows + Ubuntu + macOS)
  # ─────────────────────────────────────────────────────────────
  build-wheels:
    name: Build wheels (${{ matrix.os }})
    needs: [test-grammars, test-python]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate all grammars
        run: npm ci && npm run generate:all

      - name: Build wheels (cibuildwheel)
        uses: pypa/cibuildwheel@v4.2.0
        env:
          # Build for Python 3.12, 3.13, 3.14
          CIBW_BUILD: "cp312-* cp313-* cp314-*"
          # Skip 32-bit Windows and musl Linux
          CIBW_SKIP: "*-win32 *-musllinux*"
          # ARM64 and x86_64 on macOS
          CIBW_ARCHS_MACOS: "x86_64 arm64"
          # x86_64 on Linux
          CIBW_ARCHS_LINUX: "x86_64"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  # ─────────────────────────────────────────────────────────────
  # Build Source Distribution (sdist)
  # ─────────────────────────────────────────────────────────────
  build-sdist:
    name: Build source distribution
    needs: [test-grammars, test-python]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate all grammars
        run: npm ci && npm run generate:all

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build sdist
        run: |
          pip install --upgrade pip build
          python -m build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist/*.tar.gz

  # ─────────────────────────────────────────────────────────────
  # Build WASM Binaries
  # ─────────────────────────────────────────────────────────────
  build-wasm:
    name: Build WASM binaries
    needs: [test-grammars, test-python]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: "3.1.50"

      - name: Generate all grammars
        run: npm ci && npm run generate:all

      - name: Build WASM for all grammars
        run: npm run build:wasm

      - name: Verify WASM files exist
        run: |
          ls -la bindings/web/
          for grammar in apex soql sosl formula apex_anon sflog; do
            if [ ! -f "bindings/web/tree-sitter-${grammar}.wasm" ]; then
              echo "ERROR: Missing WASM for ${grammar}"
              exit 1
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: wasm-binaries
          path: bindings/web/*.wasm

  # ─────────────────────────────────────────────────────────────
  # Publish to TestPyPI (Runs ONLY on test_v* tags)
  # ─────────────────────────────────────────────────────────────
  publish-testpypi:
    name: Publish to TestPyPI
    if: startsWith(github.ref_name, 'test_')
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/tree-sitter-salesforce/

    permissions:
      id-token: write # Required for trusted publishing (OIDC)

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  # ─────────────────────────────────────────────────────────────
  # Publish to Production PyPI (Runs ONLY on v*.*.* tags)
  # ─────────────────────────────────────────────────────────────
  publish-pypi:
    name: Publish to PyPI
    if: startsWith(github.ref_name, 'v') && !startsWith(github.ref_name, 'test_')
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/tree-sitter-salesforce/

    permissions:
      id-token: write # Required for trusted publishing (OIDC)

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # ─────────────────────────────────────────────────────────────
  # Publish to npm with @test tag (Runs ONLY on test_v* tags)
  # ─────────────────────────────────────────────────────────────
  publish-npm-test:
    name: Publish to npm (@test)
    if: startsWith(github.ref_name, 'test_')
    needs: [build-wasm]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - uses: actions/download-artifact@v4
        with:
          name: wasm-binaries
          path: bindings/web/

      - name: Generate all grammars
        run: npm ci && npm run generate:all

      - name: Publish to npm (@test tag)
        if: env.NODE_AUTH_TOKEN != ''
        run: npm publish --access public --tag test
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ─────────────────────────────────────────────────────────────
  # Publish to npm with @latest (Runs ONLY on v*.*.* tags)
  # ─────────────────────────────────────────────────────────────
  publish-npm-prod:
    name: Publish to npm (@latest)
    if: startsWith(github.ref_name, 'v') && !startsWith(github.ref_name, 'test_')
    needs: [build-wasm]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - uses: actions/download-artifact@v4
        with:
          name: wasm-binaries
          path: bindings/web/

      - name: Generate all grammars
        run: npm ci && npm run generate:all

      - name: Publish to npm (@latest)
        if: env.NODE_AUTH_TOKEN != ''
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ─────────────────────────────────────────────────────────────
  # GitHub Release with assets (production tags only)
  # ─────────────────────────────────────────────────────────────
  github-release:
    name: Create GitHub Release
    if: startsWith(github.ref_name, 'v') && !startsWith(github.ref_name, 'test_')
    needs: [publish-pypi, publish-npm-prod]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '{dist-*,wasm-binaries}'
          merge-multiple: true
          path: release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*
          generate_release_notes: true
